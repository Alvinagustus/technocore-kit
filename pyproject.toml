[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-kit"
version = "1.0.0"
description = "Agent identity toolkit for the Technocore protocol — create DIDs, sign messages, and explore rooms"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "cryptography>=48",
    "click>=8",
]

[project.scripts]
technocore = "technocore.cli:main"

[project.urls]
Homepage = "https://github.com/Alvinagustus/technocore-kit"
Repository = "https://github.com/Alvinagustus/technocore-kit.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
technocore = ["py.typed"]